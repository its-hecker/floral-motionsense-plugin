name: Check Floral Motion Sense plugin
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch immutable APKs and check standard plugin interfaces
        run: |
          python3 tools/fetch_prebuilts.py
          python3 tools/check_port.py
      - name: Test allowlist precedence and download integrity
        run: python3 -m unittest discover -s tests -p test_setup.py -v
      - name: Prepare Android and animation tools
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          curl -fL --retry 3 https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.7.18/r8-8.7.18.jar -o "$RUNNER_TEMP/r8.jar"
          curl -fL --retry 3 https://repo.maven.apache.org/maven2/com/airbnb/android/lottie/5.2.0/lottie-5.2.0.aar -o "$RUNNER_TEMP/lottie.aar"
          unzip -p "$RUNNER_TEMP/lottie.aar" classes.jar > "$RUNNER_TEMP/lottie.jar"
      - name: Check deterministic animations and compile Motion Lab Android APIs and DEX
        run: |
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar" \
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
          LOTTIE_JAR="$RUNNER_TEMP/lottie.jar" \
          R8_JAR="$RUNNER_TEMP/r8.jar" bash settings/tests/check-motion-lab.sh
      - name: Compile all source resource XML and overlay manifests
        run: |
          set -euo pipefail
          FLORAL_AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          "$FLORAL_AAPT2" compile --dir settings/res -o "$RUNNER_TEMP/floral-settings-res.zip"
          "$FLORAL_AAPT2" compile --dir settings/common-res -o "$RUNNER_TEMP/floral-common-res.zip"
          "$FLORAL_AAPT2" compile --dir configs/framework-res -o "$RUNNER_TEMP/floral-framework-res.zip"
          "$FLORAL_AAPT2" link --manifest configs/framework-overlay.xml \
            -I "$ANDROID_HOME/platforms/android-35/android.jar" \
            -o "$RUNNER_TEMP/FloralOsloFrameworkOverlay.apk" "$RUNNER_TEMP/floral-framework-res.zip"
